[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-agent-poc"
version = "0.1.0"
description = "A small configurable agent shell for a supply disruption POC"
requires-python = ">=3.13"
dependencies = ["pydantic==2.14.1", "python-dotenv==1.2.4"]

[project.optional-dependencies]
gemini = ["langchain==1.4.7", "langgraph==1.2.17", "langchain-google-genai==4.4.2", "langgraph-checkpoint-sqlite==3.1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supply_chain_poc = ["database/migrations/*.sql"]
